name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, test, and coverage
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift toolchain
        run: swift --version

      - name: Lint Swift formatting
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests

      - name: Run tests with code coverage
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors

      - name: Export code coverage
        shell: bash
        run: |
          coverage_path="$(swift test --show-codecov-path)"
          cp "${coverage_path}" coverage.json
          test -s coverage.json

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: swift-code-coverage
          path: coverage.json
          if-no-files-found: error
          retention-days: 14
